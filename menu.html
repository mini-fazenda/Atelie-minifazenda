h1,h2,h3,button,small,span{font-weight:900}
h1{margin:2px 0 14px;font-size:clamp(28px,3vw,40px);line-height:1;color:#fffaf0;-webkit-text-stroke:3px var(--wood-edge);paint-order:stroke fill;text-shadow:0 4px 0 rgba(111,66,36,.35),0 0 10px rgba(255,255,255,.35)}
button{appearance:none;border:none;cursor:pointer;font:inherit}
.buttons{display:flex;flex-wrap:wrap;gap:10px}
#genders{margin-bottom:10px}
#genders button,#poses button,.category-tabs button,.export-footer button{padding:11px 16px;border-radius:16px;border:3px solid var(--wood-edge);color:#fffaf0;background:linear-gradient(180deg,#f2c57b,#d79b56);box-shadow:0 5px 0 #a46831,0 9px 16px rgba(91,52,25,.14);transition:.15s transform,.15s filter,.15s box-shadow;white-space:nowrap;text-shadow:-1px -1px 0 rgba(96,55,22,.65),1px -1px 0 rgba(96,55,22,.65),-1px 1px 0 rgba(96,55,22,.65),1px 1px 0 rgba(96,55,22,.65)}
#genders button.selected,#poses button.selected,.category-tabs button.active,.export-footer button{background:linear-gradient(180deg,#90d167,#6dab47);box-shadow:0 5px 0 #4f7f2c,0 9px 16px rgba(73,113,38,.18)}
#genders button:hover,#poses button:hover,.category-tabs button:hover,.export-footer button:hover{transform:translateY(1px);filter:brightness(1.03)}
.color-box{display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,250,239,.88),rgba(255,243,216,.9));border:3px solid var(--line);border-radius:22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.65)}
.palette-line{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:8px}
.palette-line>span{color:#7a4929;font-size:15px;-webkit-text-stroke:.7px rgba(255,249,235,.8);paint-order:stroke fill;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.swatch{width:28px;height:28px;border-radius:999px;border:3px solid #fff8ef;box-shadow:0 0 0 3px #8dbd67,0 2px 8px rgba(83,49,23,.18);background-clip:padding-box;position:relative;background-color:#e7d4c5}
.swatch.active{transform:scale(1.08);box-shadow:0 0 0 4px #5d8f38,0 4px 10px rgba(83,49,23,.22)}
.swatch.original{background:linear-gradient(135deg,#fff6e7 0 44%,#cfa47c 45% 55%,#fff6e7 56% 100%)}
.grid{display:grid;grid-template-columns:minmax(330px,360px) minmax(0,1fr);gap:14px;align-items:start}
.preview{position:relative;overflow:hidden;isolation:isolate;padding:10px;background:linear-gradient(180deg,rgba(255,252,245,.88),rgba(255,243,224,.88));border:3px solid var(--line);border-radius:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.preview > #c{display:block;width:100%;height:auto;border-radius:18px;background:radial-gradient(circle at center,#f9f1e1 0,#f5ecdb 48%,#efe2cf 49%,#efe2cf 58%,#f7efdf 59%,#f7efdf 68%,#efe2cf 69%,#efe2cf 78%,#f7efdf 79%)}
#poses{margin-top:10px}
.grid>div:last-child{display:flex;flex-direction:column;min-width:0}
.category-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
#options{height:525px;overflow-y:auto;padding-right:6px}
#options::-webkit-scrollbar{width:12px}
#options::-webkit-scrollbar-track{background:rgba(255,245,223,.9);border-radius:999px;border:2px solid rgba(180,128,74,.45)}
#options::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#e5b571,#c8884b);border-radius:999px;border:2px solid rgba(255,249,237,.85)}
.group{padding:14px;background:linear-gradient(180deg,rgba(255,251,242,.9),rgba(255,240,209,.92));border:3px solid var(--line);border-radius:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.72)}
.group h3{margin:0 0 12px;color:#fff9ef;font-size:23px;-webkit-text-stroke:2px var(--wood-edge);paint-order:stroke fill;text-shadow:0 3px 0 rgba(111,66,36,.28)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
.opts>button{min-height:126px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;border-radius:20px;border:3px solid var(--line);background:linear-gradient(180deg,rgba(255,251,244,.98),rgba(255,242,216,.98));box-shadow:0 6px 0 rgba(187,140,95,.85),0 10px 18px rgba(91,52,25,.10);color:#754628;text-align:center}
.opts>button:hover{transform:translateY(1px)}
.opts>button.selected{border-color:#77b34f;box-shadow:0 0 0 4px rgba(123,186,82,.28),0 6px 0 #5d8f38,0 10px 18px rgba(73,113,38,.16);background:linear-gradient(180deg,#fff8ec,#f6eccd)}
.opts img{width:76px;height:76px;object-fit:contain;image-rendering:auto}
.opts span{display:block;line-height:1.08}
.purchase-price{display:inline-flex !important;align-items:center;justify-content:center;gap:4px;min-height:24px;padding:2px 8px;border-radius:999px;background:rgba(116,181,71,.12);border:2px solid rgba(116,181,71,.35);font-size:12px}
.export-footer{margin-top:14px;padding-top:14px;border-top:3px dashed rgba(168,110,63,.45)}
.export-footer button{font-size:15px}
#msg{display:block;margin-top:10px;color:#7b4927;font-size:14px;line-height:1.45;-webkit-text-stroke:.4px rgba(255,248,234,.5);text-shadow:0 1px 0 rgba(255,255,255,.5)}
@media (max-width:860px){body{padding:8px}.box{padding:12px;border-radius:22px}.grid{grid-template-columns:1fr}#options{height:420px}.palette-line{grid-template-columns:1fr;gap:6px}h1{font-size:30px}}


.preview > canvas[data-recolor]{position:absolute;display:block;background:transparent!important;border:0!important;padding:0!important;margin:0!important;border-radius:0!important;max-width:none!important;max-height:none!important;box-shadow:none!important;}
.preview > img[data-sprite]{position:absolute;max-width:none!important;max-height:none!important;}

/* Layout compacto responsivo do menu incorporado ao jogo. */
html,body{max-width:100%;min-width:0}
body{padding:8px;font-size:14px}
.box{width:min(900px,100%);max-width:100%;margin:0 auto;padding:12px;border-width:3px;border-radius:18px}

.preview{width:100%;max-width:240px;margin:0 auto;padding:6px;border-width:2px;border-radius:16px}
.preview > #c{width:100%;height:auto}
